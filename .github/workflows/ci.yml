name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The tests never transcribe audio, and the speech model is loaded lazily, so Whisper
      # (which pulls in PyTorch, several hundred megabytes) is left out of the CI install.
      - name: Install dependencies
        run: |
          grep -v '^openai-whisper' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Test
        run: python -m pytest -q
        